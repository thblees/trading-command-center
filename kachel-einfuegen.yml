name: RSI-Divergenz-Kachel einfuegen

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kachel einfuegen
        run: python3 patch-kachel.py
      - name: Committen, aufraeumen, pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -q patch-kachel.py || true
          git rm -q .github/workflows/kachel-einfuegen.yml || true
          git commit -m "RSI-Divergenz-Screener als erste Kachel bei Eigene Tools" || echo "nichts zu committen"
          git push
